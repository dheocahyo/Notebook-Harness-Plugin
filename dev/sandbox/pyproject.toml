[project]
name = "sandbox"
version = "0.1.0"
description = "Which regions drive the drop in average price?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
# JupyterLab for this project only; nh needs JupyterLab >= 4.6 with real-time collaboration.
dev = [
    "jupyterlab>=4.6,<5",
    "jupyter-collaboration>=5,<6",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
