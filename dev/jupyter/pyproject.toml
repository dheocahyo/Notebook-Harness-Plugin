[project]
name = "nh-dev-jupyter"
version = "0.0.0"
description = "Pinned JupyterLab used for Notebook Harness development and manual tests"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyterlab==4.6.4",
    "jupyter-collaboration==5.0.4",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
