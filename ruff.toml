# One ruff config for the whole repo (gateway, hooks, nhctl, tests, scripts).
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]


# Hooks, nhctl and the shared helpers run on the system Python (3.9+).
[per-file-target-version]
"plugins/nh/hooks/**" = "py39"
"plugins/nh/scripts/**" = "py39"
"plugins/nh/server/src/nh_gateway/_shared/**" = "py39"
"plugins/nh/server/src/nh_gateway/probes/**" = "py310"

[lint.isort]
known-first-party = ["nh_gateway", "tests"]
