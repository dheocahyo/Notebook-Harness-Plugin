[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers -m "not integration and not e2e"
timeout = 180
markers =
    integration: needs a real JupyterLab subprocess (run with -m integration)
    e2e: full scenario with a fresh-kernel run (run with -m e2e)
    slow: longer than 30 s
